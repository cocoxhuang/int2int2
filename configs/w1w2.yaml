# Appendix B, first experiment:  (a_p(E))_{p<100}  ->  (w1, w2)
# Reported result: 100% validation accuracy.
model:
  src_vocab_size: 37            # base (30) + 7 special/sign tokens
  tgt_vocab_size: 37
  d_model: 128
  num_heads: 1
  d_ff: 256
  num_encoder_layers: 1
  num_decoder_layers: 1
  max_len: 52                   # longest tokenised sequence in this dataset
  dropout: 0
  architecture: 'encoder_decoder'
  is_sinusoidal: false          # learnable positional embeddings

training:
  experiment_name: 'w1w2'
  batch_size: 32
  num_epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0        # NOT the 1e-2 of Appendix B.1: see README, 'Notes'.
                           # 1e-2 converges at epoch 2 and plateaus near 91%;
                           # 0.0 reaches 100% in a single epoch.
  cache_dir: 'cache'
  seed: 42
  eval_size: 10000              # generation is slow, so cap the validation set

data:
  base: 30                      # integers are written in base 30
  eval_size: 10000
  data_path: 'data/aps100_ainvs.parquet'
  seed: 42

device:
  use_cuda: true
